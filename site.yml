---
# ═══════════════════════════════════════════════════════════════════════════
# site.yml — the whole platform, one command
#
# This is what a GitOps pipeline runs on merge to main. It is deliberately
# boring: it imports the same scenario playbooks you demo individually, so
# there is no second copy of the logic to drift out of sync.
#
#   ansible-playbook site.yml                  apply everything
#   ansible-playbook site.yml --check --diff   show what WOULD change
#
# The --check run is the one to show a sceptical audience. It is a plan for
# your platform, produced from the same code that applies it.
# ═══════════════════════════════════════════════════════════════════════════

- name: Import tenant onboarding
  ansible.builtin.import_playbook: playbooks/01-tenant-onboarding.yml

- name: Import RBAC
  ansible.builtin.import_playbook: playbooks/03-rbac-as-code.yml

- name: Import authentication
  ansible.builtin.import_playbook: playbooks/04-authentication-as-code.yml

- name: Report
  hosts: aap_local
  gather_facts: false
  tasks:
    - name: Done
      ansible.builtin.debug:
        msg:
          - "Full platform configuration applied from Git."
          - ""
          - "Verify   : ansible-playbook playbooks/06-audit-report.yml"
          - "Re-run   : ansible-playbook site.yml            (expect changed=0)"
          - "Preview  : ansible-playbook site.yml --check --diff"
          - "Remove   : ansible-playbook teardown.yml"
