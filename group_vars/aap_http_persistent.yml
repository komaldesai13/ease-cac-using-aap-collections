---
# HTTP-persistent mode: one manager process authenticates once and every task in
# the play reuses that session. This is the mode you want for large CaC runs.
ansible_connection: ansible.platform.http
ansible_platform_use_persistent_connection: true

ansible_host: "{{ aap_gateway_host }}"
ansible_user: "{{ aap_gateway.username }}"
ansible_password: "{{ aap_gateway.password }}"
ansible_httpapi_use_ssl: "{{ aap_gateway_use_ssl }}"
ansible_httpapi_validate_certs: "{{ aap_gateway.validate_certs }}"
