---
# ─────────────────────────────────────────────────────────────────────────────
# The only file you need to edit before the demo.
#
# Everything defaults to an environment variable so you can drive the whole
# booth demo from a shell instead of editing YAML on stage:
#
#   export AAP_HOSTNAME=https://aap.example.com
#   export AAP_USERNAME=admin
#   export AAP_PASSWORD='...'
#   export DEMO_PREFIX=TechGenie
#
# In a real deployment aap_gateway.password comes from Ansible Vault, HashiCorp
# Vault, or an AAP credential — never from a plaintext file in Git.
# ─────────────────────────────────────────────────────────────────────────────

aap_gateway:
  hostname: "{{ lookup('env', 'AAP_HOSTNAME') | default('https://aap.example.com', true) }}"
  username: "{{ lookup('env', 'AAP_USERNAME') | default('admin', true) }}"
  password: "{{ lookup('env', 'AAP_PASSWORD') | default('', true) }}"
  validate_certs: "{{ (lookup('env', 'AAP_VALIDATE_CERTS') | default('false', true)) | bool }}"
  request_timeout: 60

# Hostname with the scheme stripped — the http connection plugin and the
# gateway_api lookup want a bare host, not a URL.
aap_gateway_host: "{{ aap_gateway.hostname | regex_replace('^https?://', '') | regex_replace('/$', '') }}"
aap_gateway_use_ssl: "{{ aap_gateway.hostname is match('^https://') }}"

# Every resource this repo creates is prefixed with this string, so several
# people can run the demo against one shared AAP without colliding.
demo_prefix: "{{ lookup('env', 'DEMO_PREFIX') | default('TechGenie', true) }}"
