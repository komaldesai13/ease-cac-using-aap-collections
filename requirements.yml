---
# ansible-galaxy collection install -r requirements.yml
#
# Then also:  pip install -r requirements.txt
# ansible-galaxy does not install a collection's Python packages, and
# ansible.platform needs `requests` at runtime.
collections:
  # ansible.platform 2.7 is not published to Galaxy yet, so it comes from the
  # branch. Swap this for a plain version once it ships.
  - name: https://github.com/ansible/ansible.platform.git
    type: git
    version: stable-2.7

  # Provides the profile_tasks callback used by ansible.cfg for per-task timing,
  # which scenario 05 relies on.
  - name: ansible.posix
