# Demo inventory — one host per connection mode.
#
# Every host is really just localhost. What differs is HOW the ansible.platform
# modules talk to the AAP Gateway. Scenarios 00-04 and 06-09 target [aap_local].
# Scenario 05 compares all three groups side by side.
#
# Connection details live in group_vars/, so you only fill them in once.

# Action plugin runs on the control node; API calls are made inside the plugin.
# This is the default and needs no extra configuration.
[aap_local]
aap-local ansible_host=localhost

# ansible.platform.http connection plugin — each task opens a fresh HTTP session.
[aap_http_direct]
aap-direct ansible_host=localhost

# ansible.platform.http with a persistent manager — one authenticated session is
# reused by every task in the play. This is the fast path for large CaC runs.
[aap_http_persistent]
aap-persistent ansible_host=localhost

[aap_all:children]
aap_local
aap_http_direct
aap_http_persistent
