[defaults]
inventory = inventory/demo.ini
host_key_checking = False
# The old `yaml` stdout callback is gone (removed from ansible-core in 2.19 and
# from community.general in 12.0.0). The supported way to get the same readable
# block output is the default callback with result_format=yaml.
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
retry_files_enabled = False
# Booth demos are read from the back of the room — keep output wide and quiet.
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent

[persistent_connection]
connect_timeout = 60
command_timeout = 120
